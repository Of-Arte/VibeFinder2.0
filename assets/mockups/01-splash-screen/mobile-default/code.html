<style>
        body {
            background-color: #121212;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .iphone-canvas {
            width: 393px;
            height: 852px;
            margin: 0 auto;
            position: relative;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn-shadow {
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-press:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body class="dark flex items-center justify-center min-h-screen">
<!-- Mobile Screen Wrapper (iPhone 15 Pro Dimensions) -->
<div class="iphone-canvas">
<!-- Center Content Section -->
<div class="flex flex-col items-center text-center">
<!-- Logo Asset -->
<div class="w-[80px] h-[80px] mb-sm overflow-hidden">
<img alt="VibeFinder Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsfS9wZoMvQhmrKQVy1iWKM2HIkqjWUTsSeZEg9l0QUikACX1M_dY8OGcFfLJkDzclZa-m4IMTm6_X6VHGaevKsWuGKm5vxySNXHupGYKwBdTZBVFGrDtOiablyn3pFh2G1X3yOxeGb7vLFt_OOuO1aMz45hgcYJoV3FrX1VwmRzLaMCU6yZTcTrowXhdzgZ68etmOFIAMXJGmYopMEKA_2337KXcaBSGxCnm2qjO1jnnmpNdtiSGYtpF0"/>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-[#FFFFFF] mb-xs">
                VibeFinder
            </h1>
<!-- Tagline -->
<p class="font-body-md text-body-md text-[#B3B3B3]">
                Let's find your vibe.
            </p>
</div>
<!-- Lower Action Section -->
<div class="mt-xl pt-lg">
<button class="w-[280px] h-[56px] rounded-full bg-primary-container text-on-primary-container font-body-lg text-body-lg font-bold flex items-center justify-center btn-shadow active-press transition-all duration-200 hover:opacity-90">
                Get Started
            </button>
</div>
<!-- Decorative Subtle Element (Micro-interaction layer) -->
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 opacity-20">
<div class="w-1 h-1 bg-primary rounded-full animate-ping"></div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            btn.addEventListener('mousedown', () => {
                // Light haptic feedback simulation
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
