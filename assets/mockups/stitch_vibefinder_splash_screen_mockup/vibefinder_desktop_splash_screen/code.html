<style>
        body {
            background-color: #121212;
            color: #e5e2e1;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .cta-shadow {
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle Fade-in Animation */
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- Splash Content Wrapper -->
<main class="flex flex-col items-center justify-center w-full max-w-[1440px] px-xl">
<!-- Logo Container -->
<div class="fade-in" style="animation-delay: 100ms;">
<img alt="VibeFinder Logo" class="w-[100px] h-[100px] rounded-brand object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLsfS9wZoMvQhmrKQVy1iWKM2HIkqjWUTsSeZEg9l0QUikACX1M_dY8OGcFfLJkDzclZa-m4IMTm6_X6VHGaevKsWuGKm5vxySNXHupGYKwBdTZBVFGrDtOiablyn3pFh2G1X3yOxeGb7vLFt_OOuO1aMz45hgcYJoV3FrX1VwmRzLaMCU6yZTcTrowXhdzgZ68etmOFIAMXJGmYopMEKA_2337KXcaBSGxCnm2qjO1jnnmpNdtiSGYtpF0"/>
</div>
<!-- Headline -->
<div class="mt-5 fade-in" style="animation-delay: 200ms;">
<h1 class="font-headline-lg text-[44px] text-white leading-tight">
                VibeFinder
            </h1>
</div>
<!-- Tagline -->
<div class="mt-[10px] fade-in" style="animation-delay: 300ms;">
<p class="font-body-lg text-brand-tagline text-[#B3B3B3]">
                Let's find your vibe.
            </p>
</div>
<!-- CTA Button Section -->
<div class="mt-[140px] fade-in" style="animation-delay: 450ms;">
<button class="w-[320px] h-[60px] rounded-full bg-primary-container text-on-primary-container font-headline-md text-[20px] font-bold cta-shadow active:scale-95 transition-all duration-200 hover:brightness-110">
                Get Started
            </button>
</div>
</main>
<!-- Optional micro-interaction script -->
<script>
        document.querySelector('button').addEventListener('mousedown', () => {
            // Light haptic feedback simulation
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        });
    </script>
</body></html>
